[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "predictability-aware-ofdm"
version = "0.2.0"
description = "Predictability-aware masked OFDM channel-estimation experiments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "torch>=2.7",
  "matplotlib>=3.8",
  "PyYAML>=6",
]

[project.optional-dependencies]
cdl = ["sionna==2.0.1"]
results = ["pyarrow>=15"]

[project.scripts]
predictability-aware-ofdm = "experiment_cli:main"

[tool.setuptools]
py-modules = ["experiment_cli", "runtime"]

[tool.setuptools.packages.find]
where = ["src"]
